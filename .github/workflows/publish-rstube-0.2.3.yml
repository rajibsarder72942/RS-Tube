name: Publish verified RS Tube 0.2.3 once

on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-rstube-0.2.3.yml']

permissions:
  contents: read

concurrency:
  group: rstube-one-time-publish-0.2.3
  cancel-in-progress: false

jobs:
  publish-verified-apk:
    if: github.repository == 'rajibsarder72942/RS-Tube' && github.ref == 'refs/heads/main' && github.event.head_commit.message == 'Publish verified RS Tube v0.2.3 once'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: rajibsarder72942/RS-Tube
    steps:
      - name: Check exact successful build
        run: |
          gh api repos/$GH_REPO/actions/runs/43962867738 > run.json
          python3 - <<'PY'
          import json
          run = json.load(open('run.json'))
          assert run['head_sha'] == 'a569cf429172d2c5b6d8f2e3d96c149781676bb1'
          assert run['conclusion'] == 'success' and run['status'] == 'completed'
          PY
      - name: Download only the previously verified signed artifact
        run: |
          gh api repos/$GH_REPO/actions/artifacts/14273509721/zip > signed-build.zip
          echo 'b6174df7c9d86fcb06ac89bc69e33717e1dbb6f07fe53dc301093f350ac77c24  signed-build.zip' | sha256sum --check
          mkdir dist
          unzip -q signed-build.zip -d dist
          gh api repos/$GH_REPO/actions/artifacts/14273674594/zip > signer-tool.zip
          echo '6c3ae7b0565721a93782b975a66c360bcd0dbe94e279fa0762b8dea68c55de88  signer-tool.zip' | sha256sum --check
          mkdir signer-tool
          unzip -q signer-tool.zip -d signer-tool
      - name: Verify stable version, package bytes and signing certificate
        run: |
          python3 - <<'PY'
          import json, hashlib
          from pathlib import Path
          dist=Path('dist')
          metadata=json.loads((dist/'update.json').read_text())
          assert metadata['versionCode']==5 and metadata['versionName']=='0.2.3'
          assert metadata['url']=='https://github.com/rajibsarder72942/RS-Tube/releases/download/v0.2.3/RS-Tube-v0.2.3.apk'
          apk=dist/'RS-Tube-v0.2.3.apk'
          assert apk.stat().st_size==metadata['size']
          assert hashlib.sha256(apk.read_bytes()).hexdigest()==metadata['sha256']
          assert not list(dist.glob('*-test.apk'))
          for line in (dist/'SHA256SUMS.txt').read_text().splitlines():
              digest,name=line.split(maxsplit=1)
              assert hashlib.sha256((dist/name).read_bytes()).hexdigest()==digest
          assert set(p.name for p in dist.iterdir()) == {'RS-Tube-v0.2.3.apk','RS-Tube-source.zip','SHA256SUMS.txt','update.json'}
          PY
          java -jar signer-tool/apksigner.jar verify --verbose --print-certs dist/RS-Tube-v0.2.3.apk > signature.txt
          grep -F 'Signer #1 certificate SHA-256 digest: 849367b4588c4d57c3679d6f91cfed088b59a336496fcc900706ec67c4ac65cd' signature.txt
      - name: Refuse to overwrite any existing release or unrelated tag
        run: |
          if gh release view v0.2.3 >/dev/null 2>&1; then
            echo 'Release already exists; refusing to overwrite it.'
            exit 1
          fi
          if gh api repos/$GH_REPO/git/ref/tags/v0.2.3 > tag.json 2>/dev/null; then
            python3 - <<'PY'
          import json
          tag=json.load(open('tag.json'))
          assert tag['object']['type']=='commit' and tag['object']['sha']=='a569cf429172d2c5b6d8f2e3d96c149781676bb1'
          PY
          fi
      - name: Publish only version 0.2.3 at its tested source commit
        run: |
          gh release create v0.2.3 dist/RS-Tube-v0.2.3.apk dist/update.json dist/SHA256SUMS.txt dist/RS-Tube-source.zip --target a569cf429172d2c5b6d8f2e3d96c149781676bb1 --title 'RS Tube v0.2.3' --notes 'Adds Delete on each download-history entry. History only keeps the file; File + history requires confirmation and uses Android deletion permissions. Failed or denied file deletion keeps the history entry. Legacy history receives stable IDs so concurrent new downloads do not change the selected item. Automatic in-app updates and the approved logo are retained. Stable APK signature, build, tests and lint verified; physical-device deletion testing remains pending.'
      - name: Verify anonymous update metadata and uploaded APK digest
        run: |
          curl --fail --location --proto '=https' --retry 5 --retry-all-errors --retry-delay 2 https://github.com/rajibsarder72942/RS-Tube/releases/download/v0.2.3/update.json -o public-update.json
          gh api repos/$GH_REPO/releases/tags/v0.2.3 > published.json
          python3 - <<'PY'
          import json
          expected=json.load(open('dist/update.json'))
          assert json.load(open('public-update.json'))==expected
          release=json.load(open('published.json'))
          assert not release['draft'] and not release['prerelease']
          apk=next(a for a in release['assets'] if a['name']=='RS-Tube-v0.2.3.apk')
          assert apk['size']==expected['size']
          assert apk['digest']=='sha256:'+expected['sha256']
          assert apk['browser_download_url']==expected['url']
          print('Published release, anonymous update metadata and APK digest verified.')
          PY
