name: Publish verified RS Tube 0.2.1 once

on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-rstube-0.2.1.yml']

permissions:
  contents: read

concurrency:
  group: rstube-one-time-publish-0.2.1
  cancel-in-progress: false

jobs:
  publish-verified-apk:
    if: github.repository == 'rajibsarder72942/RS-Tube' && github.ref == 'refs/heads/main' && github.event.head_commit.message == 'Publish verified RS Tube v0.2.1 once'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: rajibsarder72942/RS-Tube
    steps:
      - name: Check exact successful build
        run: |
          gh api repos/$GH_REPO/actions/runs/43844643824 > run.json
          python3 - <<'PY'
          import json
          run = json.load(open('run.json'))
          assert run['head_sha'] == 'b14ff609098cdfbc528951382c18431b15decb65'
          assert run['conclusion'] == 'success' and run['status'] == 'completed'
          PY
      - name: Download only the previously verified signed artifact
        run: |
          gh api repos/$GH_REPO/actions/artifacts/14213489497/zip > signed-build.zip
          echo '6ee82c870d7449b7948ab3208b0e34004eacbeacd9c201b9ba074fd9c4f32e3b  signed-build.zip' | sha256sum --check
          mkdir dist
          unzip -q signed-build.zip -d dist
          gh api repos/$GH_REPO/actions/artifacts/14214049256/zip > signer-tool.zip
          echo '6c3ae7b0565721a93782b975a66c360bcd0dbe94e279fa0762b8dea68c55de88  signer-tool.zip' | sha256sum --check
          mkdir signer-tool
          unzip -q signer-tool.zip -d signer-tool
      - name: Verify stable version, package bytes and signing certificate
        run: |
          python3 - <<'PY'
          import json, hashlib
          from pathlib import Path
          dist=Path('dist')
          metadata=json.loads((dist/'update.json').read_text())
          assert metadata['versionCode']==3 and metadata['versionName']=='0.2.1'
          assert metadata['url']=='https://github.com/rajibsarder72942/RS-Tube/releases/download/v0.2.1/RS-Tube-v0.2.1.apk'
          apk=dist/'RS-Tube-v0.2.1.apk'
          assert apk.stat().st_size==metadata['size']
          assert hashlib.sha256(apk.read_bytes()).hexdigest()==metadata['sha256']
          assert not list(dist.glob('*-test.apk'))
          for line in (dist/'SHA256SUMS.txt').read_text().splitlines():
              digest,name=line.split(maxsplit=1)
              assert hashlib.sha256((dist/name).read_bytes()).hexdigest()==digest
          assert set(p.name for p in dist.iterdir()) == {'RS-Tube-v0.2.1.apk','RS-Tube-source.zip','SHA256SUMS.txt','update.json'}
          PY
          java -jar signer-tool/apksigner.jar verify --verbose --print-certs dist/RS-Tube-v0.2.1.apk > signature.txt
          grep -F 'Signer #1 certificate SHA-256 digest: 849367b4588c4d57c3679d6f91cfed088b59a336496fcc900706ec67c4ac65cd' signature.txt
      - name: Refuse to overwrite any existing release or unrelated tag
        run: |
          if gh release view v0.2.1 >/dev/null 2>&1; then
            echo 'Release already exists; refusing to overwrite it.'
            exit 1
          fi
          if gh api repos/$GH_REPO/git/ref/tags/v0.2.1 > tag.json 2>/dev/null; then
            python3 - <<'PY'
          import json
          tag=json.load(open('tag.json'))
          assert tag['object']['type']=='commit' and tag['object']['sha']=='b14ff609098cdfbc528951382c18431b15decb65'
          PY
          fi
      - name: Publish only version 0.2.1 at its tested source commit
        run: |
          gh release create v0.2.1 dist/RS-Tube-v0.2.1.apk dist/update.json dist/SHA256SUMS.txt dist/RS-Tube-source.zip --target b14ff609098cdfbc528951382c18431b15decb65 --title 'RS Tube v0.2.1' --notes 'Approved yellow background and dark red tilted download-arrow icon. Signed with the same stable key as v0.2.0. Build, tests, lint and APK signature verified. Compatible installations can check and download this update inside RS Tube; Android asks for installation confirmation. Physical-device installation testing remains pending.'
      - name: Verify anonymous update metadata and uploaded APK digest
        run: |
          curl --fail --location --proto '=https' --retry 5 --retry-all-errors --retry-delay 2 https://github.com/rajibsarder72942/RS-Tube/releases/download/v0.2.1/update.json -o public-update.json
          gh api repos/$GH_REPO/releases/tags/v0.2.1 > published.json
          python3 - <<'PY'
          import json
          expected=json.load(open('dist/update.json'))
          assert json.load(open('public-update.json'))==expected
          release=json.load(open('published.json'))
          assert not release['draft'] and not release['prerelease']
          apk=next(a for a in release['assets'] if a['name']=='RS-Tube-v0.2.1.apk')
          assert apk['size']==expected['size']
          assert apk['digest']=='sha256:'+expected['sha256']
          assert apk['browser_download_url']==expected['url']
          print('Published release, anonymous update metadata and APK digest verified.')
          PY
