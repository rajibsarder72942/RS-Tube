name: Build Android APK

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Cache development signing key
        if: github.event_name != 'pull_request'
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: rstube-development-key-v1
      - name: Test, lint and build APK
        run: gradle --no-daemon testDebugUnitTest lintDebug assembleDebug
      - name: Package APK and matching source
        shell: bash
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/RS-Tube-v0.1.0-test.apk
          git archive --format=zip --output=dist/RS-Tube-source.zip HEAD
          cd dist
          sha256sum *.apk *.zip > SHA256SUMS.txt
      - name: Upload installable test APK
        uses: actions/upload-artifact@v4
        with:
          name: RS-Tube-Android
          path: dist/*
          retention-days: 30
      - name: Upload verification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Android-check-reports
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-debug.html
          if-no-files-found: ignore

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: RS-Tube-Android
          path: dist
      - name: Publish test prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" dist/* --prerelease --title "RS Tube $RELEASE_TAG (test APK)" --notes "Android 10+. MP4 video and MP3 audio downloader; no built-in player. This is a development-signed test build. See the repository README for limitations and verification steps."
