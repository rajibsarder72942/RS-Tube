name: Build Android APK

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RSTUBE_KEYSTORE_BASE64: ${{ secrets.RSTUBE_KEYSTORE_BASE64 }}
      RSTUBE_KEYSTORE_PASSWORD: ${{ secrets.RSTUBE_KEYSTORE_PASSWORD }}
      RSTUBE_KEY_ALIAS: ${{ secrets.RSTUBE_KEY_ALIAS }}
      RSTUBE_KEY_PASSWORD: ${{ secrets.RSTUBE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Require stable signing before publishing
        if: startsWith(github.ref, 'refs/tags/v') && env.RSTUBE_KEYSTORE_BASE64 == ''
        run: |
          echo 'Set the four RSTUBE signing secrets described in UPDATES.md before publishing an update.'
          exit 1
      - name: Prepare private stable signing key
        if: env.RSTUBE_KEYSTORE_BASE64 != '' && github.event_name != 'pull_request'
        shell: python
        run: |
          import os, base64
          from pathlib import Path
          for name in ['RSTUBE_KEYSTORE_PASSWORD', 'RSTUBE_KEY_ALIAS', 'RSTUBE_KEY_PASSWORD']:
              if not os.environ.get(name):
                  raise SystemExit(f'Missing signing secret: {name}')
          key = Path(os.environ['RUNNER_TEMP']) / 'rstube-release.jks'
          key.write_bytes(base64.b64decode(os.environ['RSTUBE_KEYSTORE_BASE64'], validate=True))
          key.chmod(0o600)
          with open(os.environ['GITHUB_ENV'], 'a') as f:
              f.write(f'RSTUBE_KEYSTORE_FILE={key}\n')
      - name: Test, lint and build APK
        shell: bash
        run: |
          gradle --no-daemon testDebugUnitTest lintDebug assembleDebug
          if [ -n "$RSTUBE_KEYSTORE_FILE" ]; then
            gradle --no-daemon lintRelease assembleRelease
          fi
      - name: Package APK and matching source
        shell: bash
        run: |
          if [ -n "$RSTUBE_KEYSTORE_FILE" ]; then
            python3 scripts/package_release.py --apk app/build/outputs/apk/release/app-release.apk --stable
          else
            python3 scripts/package_release.py --apk app/build/outputs/apk/debug/app-debug.apk
          fi
          git archive --format=zip --output=dist/RS-Tube-source.zip HEAD
          cd dist
          sha256sum *.apk *.zip > SHA256SUMS.txt
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RS-Tube-Android
          path: dist/*
          retention-days: 30
      - name: Upload verification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Android-check-reports
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-debug.html
            app/build/reports/lint-results-release.html
          if-no-files-found: ignore
      - name: Upload Android signature verification tool
        uses: actions/upload-artifact@v4
        with:
          name: Android-apksigner
          path: ${{ env.ANDROID_HOME }}/build-tools/35.0.0/lib/apksigner.jar
          retention-days: 7
      - name: Remove private signing material
        if: always()
        shell: bash
        run: |
          if [ -n "$RSTUBE_KEYSTORE_FILE" ]; then rm -f "$RSTUBE_KEYSTORE_FILE"; fi

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: RS-Tube-Android
          path: dist
      - name: Publish app update
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          metadata=json.loads(Path('dist/update.json').read_text())
          assert os.environ['RELEASE_TAG'] == 'v' + metadata['versionName'], 'Tag/version mismatch'
          PY
          gh release create "$RELEASE_TAG" dist/* --verify-tag --title "RS Tube $RELEASE_TAG" --notes "MP4 video and MP3 audio downloader. Existing compatible installations detect this release and download its verified APK inside RS Tube. Android asks for installation confirmation. See UPDATES.md for publishing requirements and device-test status."
